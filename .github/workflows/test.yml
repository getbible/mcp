name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable source revision to validate and package
        required: false
        type: string

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Create isolated environment
        run: python -m venv .venv
      - name: Install
        run: |
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip install --no-deps -e .
      - name: Lint
        run: .venv/bin/python -m ruff check .
      - name: Type check
        run: .venv/bin/python -m mypy src
      - name: Test both MCP transports
        run: .venv/bin/python -m pytest

  package:
    name: Build downloadable distributions
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build frontend
        run: python -m pip install -r requirements-dev.txt
      - name: Build wheel and source distribution
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build
          python -m build --outdir "$RUNNER_TEMP/rebuilt-dist"
          for artifact in dist/*; do
            cmp "$artifact" "$RUNNER_TEMP/rebuilt-dist/$(basename "$artifact")"
          done
      - name: Smoke-test the built wheel
        run: |
          python -m venv .artifact-test
          .artifact-test/bin/python -m pip install -r requirements.txt
          .artifact-test/bin/python -m pip install --no-deps dist/getbible_mcp-*.whl
          .artifact-test/bin/getbible-mcp --version
          cd /tmp
          "$GITHUB_WORKSPACE/.artifact-test/bin/python" -c 'from getbible_mcp.contracts import ContractRegistry; assert len(ContractRegistry().catalog()) == 9'
      - name: Upload downloadable distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30
